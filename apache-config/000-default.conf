<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    Alias /frontend/assets "/var/www/html/frontend/assets"
    <Directory "/var/www/html/frontend/assets">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$">
            Header set Cache-Control "max-age=86400, public"
        </FilesMatch>
    </Directory>

    Alias /backend/assets "/var/www/html/backend/assets"
    <Directory "/var/www/html/backend/assets">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Configuración del DocumentRoot principal
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>