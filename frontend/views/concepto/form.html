{{define "content"}}
<div class="concepto-form-container">
    <div class="concepto-form">
        <h2>
            {{if eq .Accion "editar"}}
                Editar Concepto
            {{else}}
                Crear Nuevo Concepto
            {{end}}
        </h2>

        <form method="POST" action="{{if eq .Accion "editar"}}/concepto/editar/{{.Concepto.ID}}{{else}}/concepto/crear{{end}}">
            <div class="form-group">
                <label for="nombre">Nombre del concepto:</label>
                <input type="text" id="nombre" name="nombre" 
                       value="{{if .Concepto}}{{.Concepto.Name}}{{end}}{{.FormData.nombre}}" 
                       required>
                {{if .FieldErrors.nombre}}
                <span class="error">{{.FieldErrors.nombre}}</span>
                {{end}}
            </div>

            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Seleccionar tipo</option>
                    <option value="gasto" {{if eq .Concepto.Type "gasto"}}selected{{end}}>Gasto</option>
                    <option value="ingreso" {{if eq .Concepto.Type "ingreso"}}selected{{end}}>Ingreso</option>
                </select>
                {{if .FieldErrors.tipo}}
                <span class="error">{{.FieldErrors.tipo}}</span>
                {{end}}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    {{if eq .Accion "editar"}}Actualizar{{else}}Crear{{end}}
                </button>
                <a href="/concepto/gasto" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{{end}}
